[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-audit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/repo_audit"]

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
